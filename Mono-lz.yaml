pool: mypool

trigger: none

resources:
  repositories:
    - repository: templates
      type: git
      name: DevOps/Azure-Infra
      ref: refs/heads/main

parameters:
- name: Init
  displayName: Init
  type: boolean
  default: false

- name: Plan
  displayName: Plan
  type: boolean
  default: false

- name: Apply
  displayName: Apply
  type: boolean
  default: false

stages:
- template: templates/Init.yaml@templates
  parameters:
    Init: ${{ parameters.Init }}

- template: templates/Plan.yaml@templates
  parameters:
    Plan: ${{ parameters.Plan }}

- template: templates/Apply.yaml@templates
  parameters:
    Apply: ${{ parameters.Apply }}